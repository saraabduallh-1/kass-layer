# ~/docker-nginx/conf.d/kass.conf on arai.center → kass.arai.center
server {
    listen 80;
    server_name kass.arai.center;

    resolver 10.89.0.1 valid=30s;
    set $kass_backend http://kass_app:8000;

    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass         $kass_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        # browsers re-check the page and data on every visit (304 if unchanged), so updates show at once
        add_header         Cache-Control "no-cache" always;
    }
}
